name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ensure full history for TruffleHog
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install basedpyright
          pip install ruff
          pip install -r requirements.txt
      - name: Run Basedpyright
        run: basedpyright
      - name: Run Ruff
        run: ruff check --output-format=github . && ruff format --preview --line-length 120 .
      - name: Scan for secrets (Action)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
