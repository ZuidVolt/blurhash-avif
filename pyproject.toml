[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blurhash-avif"
version = "0.8.0"
description = "A library to generate BlurHash and PNG data URLs for AVIF images"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "ZuidVolt" }
]
keywords = ["blurhash", "avif", "image processing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "blurhash>=1.1.4",
    "numpy>=2.2.0",
    "pillow>=11.0.0",
    "psutil>=6.0.0",
    "pydantic>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/ZuidVolt/blurhash-avif"
"Issue Tracker" = "https://github.com/ZuidVolt/blurhash-avif/issues"
Changelog = "https://github.com/ZuidVolt/blurhash-avif/releases"
Source = "https://github.com/ZuidVolt/blurhash-avif"
Documentation = "https://github.com/ZuidVolt/blurhash-avif/blob/main/README.md"

[project.optional-dependencies]
dev = [
    "mypy>=1.16.0",
    "pyrefly>=0.18.1",
    "radon>=6.0.1",
    "ruff>=0.11.13",
    "vulture>=2.14",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
blurhash-avif = "blurhash_avif:generate_blurhash_and_data_url_from_avif"

# Hatchling configuration
[tool.hatch.build.targets.wheel]
packages = ["src/blurhash_avif"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 120
fix = true
unsafe-fixes = true
preview = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.pyrefly]
python-version = "3.13.0"

[tool.radon]
cc = [ "-a", "-nc", "-s",]
mi = [ "-s",]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.ruff.lint]
preview = true
select = [ "RUF", "D", "F", "W", "N", "I", "E", "A", "B", "Q", "PL", "C90", "UP", "RET", "SIM", "NPY", "PD", "ARG", "TID", "PTH", "ISC", "PIE", "YTT", "ASYNC", "C4", "T10", "COM", "RSE", "PGH", "PLR", "PLC", "PGH", "FURB", "PLW", "TRY", "PERF", "EXE", "DTZ", "INT", "ISC", "ICN", "LOG", "FLY", "EM", "SLF", "SLOT", "FBT", "BLE", "ANN", "TC",]
ignore = [ "PLR0913", "PLR0911", "PLR0914", "PLR6301", "PD901", "E501", "G004", "RUF100", "PGH003", "PLR0911", "PLR0912", "COM812", "ISC001", "TRY003", "TRY300", "EXE001", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"

[tool.ruff.lint.pydocstyle]
convention = "google"
